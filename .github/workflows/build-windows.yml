name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      model:
        description: 同梱する Whisper モデル
        type: choice
        default: small
        options: [tiny, base, small, medium, large-v3-turbo]
      llm:
        description: 同梱する分析用言語モデル
        type: choice
        default: qwen3-4b
        options: [qwen3-1.7b, qwen3-4b, qwen3-8b]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      MODEL: ${{ inputs.model || 'small' }}
      LLM: ${{ inputs.llm || 'qwen3-4b' }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build
        shell: pwsh
        run: ./build.ps1 -Model $env:MODEL -Llm $env:LLM

      - name: Self test (exe を起動して文字起こし・分析・書き出しまで確認)
        shell: pwsh
        run: |
          $p = Start-Process dist/VoiceInput/VoiceInput.exe -ArgumentList '--selftest' -Wait -PassThru
          Get-Content dist/VoiceInput/selftest.log
          if ($p.ExitCode -ne 0) { exit 1 }
          Remove-Item dist/VoiceInput/selftest.log

      - uses: actions/upload-artifact@v4
        with:
          name: VoiceInput-windows-${{ env.MODEL }}-${{ env.LLM }}
          path: dist/VoiceInput

